name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: identity_ci
          POSTGRES_PASSWORD: identity_ci
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity_ci -d identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: domainry-identity
    steps:
      - uses: actions/checkout@v4
        with:
          path: domainry-identity
      # The development go.mod intentionally uses ../domainry-identity-sdk so
      # local Module/Remote changes are tested together until the first SDK tag.
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-identity-sdk
          path: domainry-identity-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: domainry-identity/go.sum
      - name: Configure access to private Domainry modules
        env:
          DOMAINRY_MODULE_TOKEN: ${{ secrets.DOMAINRY_GITHUB_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${DOMAINRY_MODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/domainry/*
          go env -w GONOSUMDB=github.com/domainry/*
          go env -w GONOPROXY=github.com/domainry/*
      - name: Check Go formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt required:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test Go packages
        run: go test ./...
      - name: PostgreSQL integration gate
        env:
          RUNTIME_POSTGRES_TEST_REQUIRED: "true"
          RUNTIME_POSTGRES_TEST_DSN: postgres://identity_ci:identity_ci@localhost:5432/identity?sslmode=disable
        run: >-
          go test
          ./internal/infrastructure/persistence/postgres
          -run '^TestPostgresRuntimePersistenceEndToEnd$'
          -count=1
          -v
      - name: Race-check Identity boundaries
        run: >-
          go test -race
          ./module
          ./internal/adapter/identitysdk
          ./internal/application/auth
          ./internal/domain/auth/...
          ./internal/infrastructure/persistence/database/auth
          ./internal/transport/http/server
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
