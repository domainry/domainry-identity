name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domainry-identity
    steps:
      - uses: actions/checkout@v4
        with:
          path: domainry-identity
      # The development go.mod intentionally uses ../domainry-identity-sdk so
      # local Module/Remote changes are tested together until the first SDK tag.
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-identity-sdk
          path: domainry-identity-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: domainry-identity/go.sum
      - name: Check Go formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt required:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go test ./...
      - name: Race-check Identity boundaries
        run: >-
          go test -race
          ./module
          ./internal/adapter/identitysdk
          ./internal/application/auth
          ./internal/domain/auth/...
          ./internal/infrastructure/persistence/database/auth
          ./internal/transport/http/server
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  admin-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domainry-identity/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: domainry-identity
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-identity-sdk
          path: domainry-identity-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            domainry-identity/frontend/package-lock.json
            domainry-identity-sdk/browser/package-lock.json
      - name: Build Identity browser SDK
        working-directory: domainry-identity-sdk/browser
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run test:unit --workspace identity-admin
      - run: npm run build
